# nanolm's configs/part3/B2_laptop.yaml (same tasks, shots, question limits, fp32, batch size 8)
# with three more base models and the two instruct models that the tuning runs are compared with.
#   python scripts/bench.py run -c configs/benchmarks/models.yaml --slots 4
name: models
out_dir: runs/benchmarks
batch_size: 8
device: auto
models:
  - {name: gpt2-124M,             hf: gpt2,                                 dtype: float32}
  - {name: SmolLM2-135M,          hf: HuggingFaceTB/SmolLM2-135M,           dtype: float32}
  - {name: SmolLM2-360M,          hf: HuggingFaceTB/SmolLM2-360M,           dtype: float32}
  - {name: Qwen2.5-0.5B,          hf: Qwen/Qwen2.5-0.5B,                    dtype: float32}
  - {name: Qwen3-0.6B-Base,       hf: Qwen/Qwen3-0.6B-Base,                 dtype: float32}
  - {name: Qwen3.5-0.8B-Base,     hf: Qwen/Qwen3.5-0.8B-Base,               dtype: float32}
  - {name: SmolLM2-360M-Instruct, hf: HuggingFaceTB/SmolLM2-360M-Instruct,  dtype: float32}
  - {name: Qwen2.5-0.5B-Instruct, hf: Qwen/Qwen2.5-0.5B-Instruct,           dtype: float32}
task_groups:
  knowledge:
    tasks: [arc_easy, arc_challenge, hellaswag, mmlu]
    num_fewshot: 0
    limit: 300            # the first 300 questions per task (per MMLU subject)
  math:
    tasks: [gsm8k]
    num_fewshot: 5
    limit: 100
