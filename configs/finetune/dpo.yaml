# Preference tuning (DPO) with LoRA: nanolm's configs/part2/P3_dpo.yaml with fp32 weights and no
# wall-clock cap (max_time_sec 0).
# beta is set per run with train.dpo_beta=0.05|0.1|0.5.
name: dpo
model: {name: "Qwen/Qwen2.5-0.5B-Instruct", dtype: fp32, lora: true, lora_r: 16}
data: {format: ultrafeedback, dataset: "trl-lib/ultrafeedback_binarized", split: train, val_split: test,
       n_train: 800, n_val: 100, max_len: 512, min_score_gap: 2.0}
train: {method: dpo, steps: 100, batch_size: 2, grad_accum: 4, lr: 5e-5, warmup_steps: 10, dpo_beta: 0.1,
        eval_every: 25, max_time_sec: 0}
